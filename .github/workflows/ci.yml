name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: extractions/setup-just@v4
      - run: python -m pip install -r requirements-dev.txt
      - run: just check
      - run: just test
